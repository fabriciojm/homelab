apiVersion: apps/v1
kind: Deployment
metadata:
  name: laf-inference
  namespace: laf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laf-inference
  template:
    metadata:
      labels:
        app: laf-inference
    spec:
      nodeSelector:
        workload: inference
      volumes:
        - name: model-data
          persistentVolumeClaim:
            claimName: laf-model-data

        - name: output-data
          persistentVolumeClaim:
            claimName: laf-output-data

      initContainers:
        - name: model-downloader
          image: python:3.12-slim
          command:
            - bash
            - -c
            - |
              pip install --no-cache-dir huggingface_hub

              if [ ! -f /models/sd_turbo.safetensors ]; then
                hf download stabilityai/sd-turbo \
                  sd_turbo.safetensors \
                  --revision b261bac6fd2cf515557d5d0707481eafa0485ec2 \
                  --local-dir /models
              fi

          volumeMounts:
            - name: model-data
              mountPath: /models
      containers:
        - name: laf-inference
          image: ghcr.io/fabriciojm/laf-inference:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: laf-inference-configmap
          #   - secretRef:
          #       name: laf-inference-container-env
          volumeMounts:
            - name: model-data
              mountPath: /models

            - name: output-data
              mountPath: /output
